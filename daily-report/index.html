<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀 일일업무보고</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div>
        <h1>일일업무보고</h1>
        <p id="team-name" class="brand-sub"></p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="화면 선택">
      <button type="button" role="tab" id="tab-input" data-tab="input">내 업무 입력</button>
      <button type="button" role="tab" id="tab-leader" data-tab="leader">팀 현황</button>
    </nav>
    <button type="button" id="me-chip" class="me-chip"></button>
    <span id="store-badge" class="store-badge"></span>
  </header>

  <div id="config-error" class="banner banner-error" hidden></div>

  <!-- 팀원: 내 업무 입력 -->
  <main id="view-input" class="view" role="tabpanel" aria-labelledby="tab-input">
    <div class="toolbar">
      <div class="whoami" id="whoami" hidden>
        <span class="whoami-label">작성자</span>
        <strong id="me-name"></strong>
        <select id="my-part" aria-label="내 소속파트"></select>
        <button type="button" class="btn ghost small" id="me-change">변경</button>
      </div>
      <div class="date-nav" role="group" aria-label="보고 날짜">
        <button type="button" class="icon-btn" id="in-prev" aria-label="이전 근무일">‹</button>
        <input type="date" id="in-date" aria-label="보고 날짜">
        <button type="button" class="icon-btn" id="in-next" aria-label="다음 근무일">›</button>
        <button type="button" class="btn ghost" id="in-today">오늘</button>
      </div>
    </div>

    <div id="me-empty" class="empty-state" hidden>
      <strong>먼저 이름을 입력하세요.</strong>
      <span>한 번만 입력하면 이 PC의 크롬에 저장됩니다.</span>
      <div><button type="button" class="btn primary" id="me-open">이름 입력하기</button></div>
    </div>

    <div id="in-body">
      <p id="in-heading" class="report-heading"></p>
      <div id="in-notice" class="banner banner-info" hidden></div>
      <div id="carry-notice" class="banner banner-carry" hidden></div>

      <section class="block">
        <header class="block-head">
          <h2>업무 목록</h2>
        </header>
        <div class="entry entry-head" aria-hidden="true">
          <span>#</span><span>소속파트</span><span>제목</span><span>내용</span><span>진행율</span><span>비고</span><span>담당자</span><span></span>
        </div>
        <div id="entries" class="entries"></div>
        <div class="add-row">
          <button type="button" class="btn add" id="add-entry">+ 빈 업무 추가</button>
          <button type="button" class="btn add" id="open-loader">+ 지난 업무에서 불러오기</button>
        </div>
      </section>

      <div class="savebar">
        <span id="dirty-text" class="dirty-text"></span>
        <button type="button" class="btn primary" id="save-btn">저장</button>
      </div>
    </div>
  </main>

  <!-- 팀장: 팀 현황 -->
  <main id="view-leader" class="view" role="tabpanel" aria-labelledby="tab-leader" hidden>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="보기 방식">
        <button type="button" data-mode="day">일간</button>
        <button type="button" data-mode="week">주간</button>
      </div>
      <div class="date-nav" role="group" aria-label="조회 날짜">
        <button type="button" class="icon-btn" id="ld-prev" aria-label="이전">‹</button>
        <input type="date" id="ld-date" aria-label="조회 날짜">
        <button type="button" class="icon-btn" id="ld-next" aria-label="다음">›</button>
        <button type="button" class="btn ghost" id="ld-today">오늘</button>
      </div>
      <label class="field">
        <span>소속파트</span>
        <select id="part-filter"></select>
      </label>
      <span class="spacer"></span>
      <button type="button" class="btn" id="copy-tsv">엑셀로 복사</button>
      <button type="button" class="btn" id="dl-csv">CSV 저장</button>
      <button type="button" class="btn" id="ld-refresh">새로고침</button>
    </div>

    <div id="summary" class="summary"></div>
    <div id="grid" class="grid-wrap"></div>
    <p id="loaded-at" class="meta"></p>
  </main>
</div>

<datalist id="member-list"></datalist>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="me-dialog" class="dialog-backdrop" hidden>
  <form class="dialog me-form" id="me-setup" aria-labelledby="me-title">
    <h2 id="me-title">이름과 소속파트</h2>
    <p class="meta">이 PC의 크롬에 저장되어, 다음부터는 묻지 않고 바로 업무를 입력합니다. 새 업무의 소속파트와 담당자도 이 값으로 미리 채워집니다.</p>
    <label class="field-col"><span>이름</span>
      <input type="text" id="me-input" list="member-list" placeholder="예: 김민준" autocomplete="off">
    </label>
    <label class="field-col"><span>소속파트</span>
      <select id="setup-part"></select>
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn" id="me-cancel">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</div>

<div id="loader" class="dialog-backdrop" hidden>
  <div class="dialog loader" role="dialog" aria-modal="true" aria-labelledby="loader-title">
    <header class="loader-head">
      <h2 id="loader-title">지난 업무에서 불러오기</h2>
      <button type="button" class="icon-btn del" id="loader-close" aria-label="닫기">×</button>
    </header>
    <div class="loader-filters">
      <label class="field"><span>누구</span>
        <select id="ldr-who"></select>
      </label>
      <label class="field"><span>기간</span>
        <select id="ldr-period">
          <option value="30">최근 1개월</option>
          <option value="90" selected>최근 3개월</option>
          <option value="180">최근 6개월</option>
          <option value="365">최근 1년</option>
          <option value="0">전체</option>
        </select>
      </label>
      <input type="search" id="ldr-q" placeholder="제목·내용·담당자 검색" aria-label="검색어">
    </div>
    <p id="ldr-count" class="meta"></p>
    <div id="ldr-list" class="loader-list"></div>
    <footer class="loader-foot">
      <span id="ldr-picked" class="meta"></span>
      <button type="button" class="btn" id="ldr-cancel">취소</button>
      <button type="button" class="btn primary" id="ldr-add" disabled>선택한 업무 추가</button>
    </footer>
  </div>
</div>

<div id="dialog" class="dialog-backdrop" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-msg">
    <p id="dialog-msg" class="dialog-msg"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-act="cancel">취소</button>
      <button type="button" class="btn primary" data-act="ok">확인</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/store-mock.js"></script>
<script src="js/store-goodocs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
