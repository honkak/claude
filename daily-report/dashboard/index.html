<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과제 관리 대시보드</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<!--
  팀장 전용 대시보드 페이지.
  일반 화면(../index.html)과 같은 설정·저장소·데이터 해석 규칙을 쓰고, 화면 코드(app.js)는 쓰지 않습니다.
  나중에 팀장 전용 솔루션으로 옮길 때는 이 폴더와 공통 js(config, util, model, store-*)만 가져가면 됩니다.
-->
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div>
        <h1 id="team-title"></h1>
        <p id="team-name" class="brand-sub"></p>
      </div>
    </div>
    <span id="store-badge" class="store-badge" style="margin-left:auto"></span>
  </header>
  <main id="dash-root" class="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../js/config.js"></script>
<script src="../js/util.js"></script>
<script src="../js/model.js"></script>
<script src="../js/store-mock.js"></script>
<script src="../js/store-goodocs.js"></script>
<script src="dashboard.js"></script>
<script>
  (function () {
    const cfg = window.APP_CONFIG;
    const store = DR.createStore();
    document.getElementById('team-title').textContent = cfg.TEAM_NAME;
    document.getElementById('team-name').textContent = '팀장용 과제 관리';
    const badge = document.getElementById('store-badge');
    badge.textContent = store.label;
    badge.dataset.kind = store.kind;
    const dash = DR.Dashboard.create(store);
    dash.mount(document.getElementById('dash-root'));
    dash.show();
  })();
</script>
</body>
</html>
